<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" fill="none">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF62" stop-opacity="0"/>
      <stop offset="25%" stop-color="#D4AF62" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#F3E5BD"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F3E5BD"/>
      <stop offset="75%" stop-color="#D4AF62" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF62" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="centerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="50%" stop-color="#D4AF62"/>
      <stop offset="100%" stop-color="#8F6A22"/>
    </linearGradient>
  </defs>

  <!-- Left Line & Flourish -->
  <line x1="20" y1="30" x2="250" y2="30" stroke="url(#divGold)" stroke-width="1.5"/>
  <circle cx="160" cy="30" r="2" fill="#D4AF62"/>
  <circle cx="210" cy="30" r="2.5" fill="#E5C378"/>
  <path d="M230 30 Q240 22, 252 26 Q245 34, 265 30" stroke="url(#centerGold)" stroke-width="1.2" fill="none"/>

  <!-- Right Line & Flourish -->
  <line x1="350" y1="30" x2="580" y2="30" stroke="url(#divGold)" stroke-width="1.5"/>
  <circle cx="440" cy="30" r="2" fill="#D4AF62"/>
  <circle cx="390" cy="30" r="2.5" fill="#E5C378"/>
  <path d="M370 30 Q360 22, 348 26 Q355 34, 335 30" stroke="url(#centerGold)" stroke-width="1.2" fill="none"/>

  <!-- Central 8-Pointed Star Rosette -->
  <g transform="translate(300, 30)">
    <!-- Outer delicate rays -->
    <circle cx="0" cy="0" r="20" stroke="url(#centerGold)" stroke-width="0.8" stroke-dasharray="2,3" fill="none"/>
    
    <!-- 8-Pointed Star -->
    <rect x="-10" y="-10" width="20" height="20" fill="url(#centerGold)" rx="1"/>
    <rect x="-10" y="-10" width="20" height="20" fill="url(#centerGold)" rx="1" transform="rotate(45)"/>
    
    <!-- Inner Floral Petals -->
    <circle cx="0" cy="0" r="6.5" fill="#063B30"/>
    <circle cx="0" cy="0" r="4" fill="url(#centerGold)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFBE6"/>
    
    <!-- Side Wing Ornaments -->
    <path d="M-15 0 C-22 -8, -26 8, -32 0 C-26 -4, -22 2, -15 0 Z" fill="url(#centerGold)"/>
    <path d="M15 0 C22 -8, 26 8, 32 0 C26 -4, 22 2, 15 0 Z" fill="url(#centerGold)"/>
  </g>
</svg>

