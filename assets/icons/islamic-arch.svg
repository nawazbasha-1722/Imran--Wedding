<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="35%" stop-color="#E5C378"/>
      <stop offset="70%" stop-color="#D4AF62"/>
      <stop offset="100%" stop-color="#8C6824"/>
    </linearGradient>
  </defs>

  <!-- Grand Scalloped Islamic Arch Contour -->
  <path d="M40 480 L40 220 
           C40 180, 70 140, 110 115 
           C130 102, 160 85, 200 40 
           C240 85, 270 102, 290 115 
           C330 140, 360 180, 360 220 
           L360 480" 
        stroke="url(#archGold)" stroke-width="3" fill="none"/>

  <!-- Inner Scallops (Multi-foil Arch) -->
  <path d="M56 480 L56 226 
           C56 205, 68 188, 88 182 
           C92 165, 110 152, 128 152 
           C140 135, 164 125, 185 130 
           C192 110, 200 90, 200 80 
           C200 90, 208 110, 215 130 
           C236 125, 260 135, 272 152 
           C290 152, 308 165, 312 182 
           C332 188, 344 205, 344 226 
           L344 480" 
        stroke="url(#archGold)" stroke-width="1.8" stroke-dasharray="6,3" fill="none" opacity="0.85"/>

  <!-- Arch Keystones & Finial -->
  <g transform="translate(200, 36)">
    <circle cx="0" cy="0" r="6" fill="url(#archGold)"/>
    <path d="M0 -6 L0 -20" stroke="url(#archGold)" stroke-width="2"/>
    <circle cx="0" cy="-22" r="3" fill="url(#archGold)"/>
  </g>

  <!-- Left Column Capital & Base -->
  <rect x="25" y="215" width="30" height="12" rx="2" fill="url(#archGold)"/>
  <rect x="25" y="470" width="30" height="12" rx="2" fill="url(#archGold)"/>

  <!-- Right Column Capital & Base -->
  <rect x="345" y="215" width="30" height="12" rx="2" fill="url(#archGold)"/>
  <rect x="345" y="470" width="30" height="12" rx="2" fill="url(#archGold)"/>
</svg>

